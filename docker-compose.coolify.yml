# Beyza Blanc — Coolify için Docker Compose (tek proje: uygulama + PostgreSQL + günlük yedek).
# Coolify'da: Yeni kaynak → Docker Compose → bu depo → "Docker Compose Location": /docker-compose.coolify.yml
# HTTPS ve alan adını Coolify (Traefik) yönetir; burada port açılmaz. SERVICE_* değişkenlerini Coolify üretir.
#
# Kalıcı hacimler:
#   pgdata   → veritabanı (içerik, katalog, teklifler VE panelden yüklenen tüm görseller bb_media tablosunda)
#   uploads  → /app/public/uploads (dosya olarak eklenecek görseller / gelecekteki yüklemeler; dağıtımda silinmez)
#   backups  → günlük pg_dump yedekleri (14 gün tutulur)

services:
  app:
    build:
      context: ./platform
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - SITE_URL=${SERVICE_URL_APP}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${PGUSER:-beyza}
      - PGPASSWORD=${SERVICE_PASSWORD_DB}
      - PGDATABASE=${PGDATABASE:-beyza}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      - SEED_ON_START=1
      - NODE_ENV=production
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PGUSER:-beyza}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
      - POSTGRES_DB=${PGDATABASE:-beyza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Günlük yedek: her 24 saatte pg_dump, 14 günden eskiler silinir. Dosyalar "backups" hacminde.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=${PGUSER:-beyza}
      - PGPASSWORD=${SERVICE_PASSWORD_DB}
      - PGDATABASE=${PGDATABASE:-beyza}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'while true; do
        pg_dump -Fc -f "/backups/beyza-$(date +%F-%H%M).dump" && echo "yedek alındı $(date)";
        find /backups -name "beyza-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
  uploads:
  backups:
