<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasarım Detayı — Beyza Blanc</title>
<meta name="description" content="Hazır tasarım detayı: ürün, boyut, hediye büyüklüğü, çikolata tipi ve kişiselleştirme seçenekleri. Tasarımı stüdyoda kendine göre değiştir veya Instagram’dan fiyat iste.">
<meta name="theme-color" content="#fff8f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<meta name="robots" content="noindex">
</head>
<body data-sayfa="urun">
<a class="skip-link" href="#icerik">İçeriğe geç</a>
<div data-bilesen="ustbar"></div>
<div data-bilesen="duyuru"></div>

<main id="icerik">
  <section class="bolum">
    <div class="kap">
      <div class="detay" id="detay"></div>
    </div>
  </section>

  <section class="bolum bolum--dar bolum--krem">
    <div class="kap">
      <h2>Bu tasarımı beğendin mi?</h2>
      <p class="soluk">
        Stüdyoda açıp ismi, tarihi, fotoğrafı ve renkleri değiştirebilirsin. Fiyat ve teslim tarihini
        Instagram’dan aynı gün iletiyoruz.
      </p>
      <div class="hero__eylem">
        <a class="btn btn--birincil" href="studyo.html">Tasarım stüdyosunu aç</a>
        <a class="btn btn--cizgili" href="koleksiyonlar.html">Diğer tasarımlar</a>
      </div>
    </div>
  </section>

  <!-- Benzer tasarımlar: aynı özel gün veya aynı alıcı grubundan -->
  <section class="bolum bolum--dar" id="benzer-bolum" hidden>
    <div class="kap">
      <div class="bolum-baslik">
        <div>
          <h2>Bunları da beğenebilirsin</h2>
          <p class="soluk">Aynı özel gün veya aynı kişi için hazırlanmış diğer tasarımlar.</p>
        </div>
      </div>
      <div class="serit" id="benzer"></div>
    </div>
  </section>
</main>

<div data-bilesen="altbilgi"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
