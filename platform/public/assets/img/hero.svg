<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="Krem kutu içinde madlen çikolatalar, altın kurdele, isim kartı ve fotoğraf madalyonu">
  <defs>
    <linearGradient id="heroKutu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f1"/>
      <stop offset="1" stop-color="#eeddc8"/>
    </linearGradient>
    <radialGradient id="heroMadlen" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8a5a35"/>
      <stop offset="1" stop-color="#5c351c"/>
    </radialGradient>
    <linearGradient id="heroKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f4ece0"/>
    </linearGradient>
    <g id="hMadlen">
      <circle r="46" fill="url(#heroMadlen)"/>
      <path d="M-28 8 A28 28 0 0 1 10 -22" fill="none" stroke="#ffffff45" stroke-width="5" stroke-linecap="round"/>
      <path d="M-16 22 A22 22 0 0 1 22 -6" fill="none" stroke="#ffffff30" stroke-width="4" stroke-linecap="round"/>
      <circle r="46" fill="none" stroke="#3d201622" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="900" height="720" fill="#f6ebdc"/>
  <circle cx="720" cy="130" r="150" fill="#fff8f3"/>
  <circle cx="120" cy="640" r="110" fill="#f0e2ce"/>

  <rect x="90" y="150" width="620" height="430" rx="24" fill="url(#heroKutu)" stroke="#e0cdb4" stroke-width="3"/>
  <rect x="112" y="172" width="576" height="386" rx="14" fill="none" stroke="#3d20161a" stroke-width="2"/>

  <text x="132" y="222" fill="#3d201699" font-family="Georgia, serif" font-size="20" letter-spacing="6">DOĞUM GÜNÜ</text>
  <text x="132" y="276" fill="#3d2016" font-family="Georgia, serif" font-size="56">Elif &amp; Mert</text>
  <text x="132" y="312" fill="#3d2016aa" font-family="Georgia, serif" font-size="22" letter-spacing="3">12 MART 2026</text>

  <g>
    <use href="#hMadlen" x="180" y="392"/><use href="#hMadlen" x="292" y="392"/><use href="#hMadlen" x="404" y="392"/><use href="#hMadlen" x="516" y="392"/>
    <use href="#hMadlen" x="180" y="500"/><use href="#hMadlen" x="292" y="500"/><use href="#hMadlen" x="404" y="500"/><use href="#hMadlen" x="516" y="500"/>
  </g>
  <g fill="#f7ead9" font-family="Georgia, serif" font-size="22" text-anchor="middle">
    <text x="180" y="400">E</text><text x="292" y="400">&amp;</text><text x="404" y="400">M</text>
  </g>

  <rect x="90" y="470" width="620" height="26" fill="#cfb56a"/>
  <g fill="#cfb56a">
    <ellipse cx="700" cy="458" rx="28" ry="18" transform="rotate(-18 700 458)"/>
    <ellipse cx="700" cy="508" rx="28" ry="18" transform="rotate(18 700 508)"/>
    <circle cx="700" cy="483" r="13"/>
  </g>

  <g transform="translate(640 300)">
    <circle r="104" fill="#fffdf9" stroke="#cfb56a" stroke-width="7"/>
    <circle r="88" fill="#efe0cb"/>
    <path d="M-30 30c0-24 60-24 60 0" fill="none" stroke="#a98b66" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-22" cy="-6" r="9" fill="#a98b66"/>
    <circle cx="22" cy="-6" r="9" fill="#a98b66"/>
  </g>

  <g transform="translate(560 620) rotate(-4)">
    <rect width="270" height="100" rx="12" fill="url(#heroKart)" stroke="#3d201622" stroke-width="1.5"/>
    <text x="24" y="42" fill="#a98336" font-family="Georgia, serif" font-size="21">İyi ki doğdun,</text>
    <text x="24" y="74" fill="#a98336" font-family="Georgia, serif" font-size="21">hep mutlu ol.</text>
  </g>
</svg>
