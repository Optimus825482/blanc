# Beyza Blanc: uygulama + PostgreSQL + Caddy (HTTPS). Ayarlar .env dosyasından okunur (bkz. .env.example).
name: beyza

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-beyza}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD .env dosyasında tanımlanmalı}
      POSTGRES_DB: ${PGDATABASE:-beyza}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Şema ilk açılışta uygulanır (boş veri klasöründe). Sonraki değişiklikler için: docker compose --profile tools run --rm migrate
      - ./platform/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./platform
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # Şema ve tohum: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ./platform
      target: build
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node db/seed.mjs"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN (örn. beyzablanc.example) .env dosyasında tanımlanmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
